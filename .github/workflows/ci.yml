name: Relay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      env:
        PYTHONPATH: src
      run: |
        pytest tests/ -v

    - name: Run Benchmark Evaluation
      env:
        PYTHONPATH: src
      run: |
        python src/relay/eval/eval_runner.py

    - name: Run End-to-End Demo Script
      env:
        PYTHONPATH: src
      run: |
        python src/relay/demo.py
